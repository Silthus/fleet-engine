<html lang="en">

<meta name="description" content="Fleet sets up T3 Code, Claude Code, Codex, and agent workflows on your Mac and your Linux devboxes. Choose where it runs, and copy one prompt that sets it up.">

<style>
:root {
  --bg: #eeefe9;
  --surface: #fdfdf8;
  --sunk: #e5e7e0;
  --fg: #151515;
  --muted: #5c5d56;
  --line: #d0d1c9;
  --edge: #151515;
  --shadow: #151515;
  --accent: #1d4aff;
  --accent-ink: #ffffff;
  --accent-soft: #dde4ff;
  --link: #b83a00;
  --yellow: #f1a82c;
  --on-yellow: #151515;
  --yellow-edge: #151515;
  --warn-bg: #fbebc8;
  --warn-fg: #6a4500;
  --code-bg: #151515;
  --code-fg: #eeefe9;
  --code-line: #151515;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --surface: #1f1f1f; --sunk: #2c2c2c; --fg: #eeefe9; --muted: #a9aaa2; --line: #4b4b4b;
    --edge: #eeefe9; --shadow: #000000; --accent: #8aa2ff; --accent-ink: #0b1220; --accent-soft: #1e2747; --link: #ff8a52;
    --yellow-edge: #a8700f; --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #0b0b0b; --code-line: #4b4b4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --surface: #1f1f1f; --sunk: #2c2c2c; --fg: #eeefe9; --muted: #a9aaa2; --line: #4b4b4b;
  --edge: #eeefe9; --shadow: #000000; --accent: #8aa2ff; --accent-ink: #0b1220; --accent-soft: #1e2747; --link: #ff8a52;
  --yellow-edge: #a8700f; --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #0b0b0b; --code-line: #4b4b4b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 16px; }
html:has(dialog[open]) { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-body); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: clamp(1.45rem, 3vw, 1.95rem); font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 700; }
p, ul, ol { margin: 0; }
a { color: var(--link); font-weight: 600; text-underline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--sunk); padding: 0.05em 0.35em; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
svg { display: block; }
.eyebrow { font: 600 0.72rem/1.2 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.prose { max-width: 65ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.badge { font: 600 0.68rem/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }

.top { border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.wordmark { display: flex; align-items: center; gap: 10px; font: 700 1.3rem/1 var(--f-body); letter-spacing: -0.01em; color: var(--fg); text-decoration: none; }
.wordmark svg { width: 34px; height: 34px; }
.top nav { display: flex; gap: 4px 20px; flex-wrap: wrap; justify-content: flex-end; font-size: 0.95rem; }
.top nav a { color: var(--fg); text-decoration: none; padding-block: 4px; }
.top nav a:hover { text-decoration: underline; }

.hero { padding-block: 40px 36px; }
.hero-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.hero-text { display: grid; gap: 16px; }
.hero h1 { font-size: clamp(2rem, 3.9vw, 2.9rem); }
.hero h1 span { display: block; }
.lead { font-size: 1.2rem; line-height: 1.45; font-weight: 500; max-width: 46ch; }
.hero-text > p:not(.lead):not(.cta) { color: var(--muted); max-width: 54ch; }
.hero-text b { color: var(--fg); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px; }
.overview { margin: 0; border: 1.5px solid var(--edge); border-radius: 16px; box-shadow: 0 6px 0 var(--shadow); padding: 4px; background: var(--bg); overflow-x: auto; }
.overview img { display: block; width: 100%; height: auto; border-radius: 12px; }

.btn-line, .btn-solid { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--edge); border-radius: 8px; box-shadow: 0 3px 0 var(--shadow); font-weight: 700; text-decoration: none; padding: 7px 14px; font-size: 0.9rem; transition: transform 0.1s, box-shadow 0.1s; }
.btn-line { background: var(--surface); color: var(--fg); }
.btn-solid { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow-edge); box-shadow: 0 3px 0 var(--yellow-edge); }
.btn-line:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--shadow); }
.btn-solid:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--yellow-edge); }
.btn-line:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.btn-solid:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--yellow-edge); }
.big { padding: 11px 20px; font-size: 1.02rem; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; color: var(--code-fg); border: 1.5px solid color-mix(in srgb, var(--code-fg) 45%, transparent); border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 0.9rem; text-decoration: none; }
.btn-ghost:hover { border-color: var(--code-fg); }
.btn-ghost svg { width: 15px; height: 15px; }

.band { padding-block: 48px; border-top: 1px solid var(--line); }
.band > .wrap { display: grid; gap: 22px; }
.band-head { display: grid; gap: 8px; }
.small { font-size: 0.9rem; }
.after { max-width: 80ch; }

.console { border: 1.5px solid var(--edge); border-radius: 16px; box-shadow: 0 6px 0 var(--shadow); background: var(--surface); overflow: hidden; }
.wheres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 0; padding: 0; margin: 0; min-width: 0; background: var(--sunk); }
.where { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 16px 20px; cursor: pointer; border-bottom: 1.5px solid var(--edge); min-width: 0; color: var(--muted); }
.where + .where { border-left: 1.5px solid var(--edge); }
.where:hover { color: var(--fg); }
.where.on { background: var(--surface); color: var(--fg); border-bottom-color: var(--surface); }
.where input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.where-name { font: 700 1.15rem/1.2 var(--f-body); }
.where.on .badge { background: var(--yellow); color: var(--on-yellow); }
.console-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.setup { display: grid; gap: 16px; align-content: start; padding: 22px 22px 24px; min-width: 0; }
.where-map { width: 100%; max-width: 380px; height: auto; }
.d-zone { fill: var(--sunk); stroke: none; }
.d-zone-t { fill: var(--muted); font: 500 10px var(--f-mono); }
.d-node { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.d-ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; }
.d-txt { fill: var(--fg); font: 600 13px var(--f-body); }
.d-small { fill: var(--muted); font: 10.5px var(--f-body); }
.d-faint { opacity: 0.8; }
.d-link { stroke: var(--accent); stroke-width: 2; fill: none; }
.d-nolink { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; opacity: 0.6; }
.where-facts { padding-left: 1.15em; display: grid; gap: 4px; font-size: 0.95rem; }
.group { display: grid; gap: 8px; }
.chips { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.9rem; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 4px 11px 4px 4px; }
.chip .icon { background: var(--yellow); color: var(--on-yellow); }
.chip.new { border-color: var(--edge); animation: arrive 0.5s ease-out; }
.extra { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 10px; }
.extra:hover { border-color: var(--muted); }
.extra.on { border-color: var(--edge); background: var(--surface); }
.extra.on .icon { background: var(--yellow); color: var(--on-yellow); }
.extra.on .icon.brand { background: #fdfdf8; box-shadow: inset 0 0 0 1.5px var(--yellow); }
.extra:not(.on) .icon.brand svg { filter: grayscale(1); opacity: 0.65; }
.extra-text { display: grid; font-size: 0.86rem; line-height: 1.35; color: var(--muted); min-width: 0; }
.extra-text b { font-size: 0.98rem; color: var(--fg); }
.extra[aria-checked="true"] .switch { background: var(--accent); box-shadow: none; }
.extra[aria-checked="true"] .switch::after { transform: translateX(20px); }

.paste { background: var(--code-bg); color: var(--code-fg); padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; border-left: 1.5px solid var(--edge); }
.steps { list-style: none; counter-reset: step; padding: 0; display: grid; gap: 8px; font-size: 0.92rem; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; color: color-mix(in srgb, var(--code-fg) 78%, transparent); }
.steps > li::before { content: counter(step); font: 500 0.78rem/22px var(--f-mono); width: 22px; height: 22px; border-radius: 50%; text-align: center; background: color-mix(in srgb, var(--code-fg) 16%, transparent); color: var(--code-fg); }
.steps b { color: var(--code-fg); }
.steps a { color: var(--yellow); }
.steps > li:last-child::before { background: var(--yellow); color: var(--on-yellow); }
.out { background: var(--code-bg); color: var(--code-fg); border: 1.5px solid var(--code-line); border-radius: 12px; overflow: hidden; min-width: 0; }
.paste .out { border-color: color-mix(in srgb, var(--code-fg) 28%, transparent); background: color-mix(in srgb, var(--code-fg) 5%, transparent); }
.out-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 12px 16px 0; }
.out-title { font: 600 0.72rem/1.4 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; }
.out-note { font: 0.78rem var(--f-mono); opacity: 0.75; }
.out pre { margin: 0; padding: 12px 16px 14px; font: 0.84rem/1.7 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.out pre:focus-visible { outline-offset: -3px; }
.tok { color: var(--yellow); font-weight: 500; }
.fresh { border-radius: 3px; animation: fresh 1.4s ease-out; }
.out-foot { display: flex; align-items: center; gap: 12px; padding: 2px 16px 16px; flex-wrap: wrap; }
.out .btn-solid { border-color: var(--yellow); box-shadow: 0 3px 0 #a8700f; }
.out .btn-solid:hover { box-shadow: 0 4px 0 #a8700f; }
.out .btn-solid:active { box-shadow: 0 1px 0 #a8700f; }
.out.empty { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
.out.empty p { padding: 8px 16px 18px; font-size: 0.95rem; }
@keyframes fresh { from { background: color-mix(in srgb, var(--yellow) 55%, transparent); } to { background: transparent; } }
@keyframes arrive { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }

.icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); flex: none; }
.icon svg { width: 22px; height: 22px; }
.icon.mini { width: 26px; height: 26px; border-radius: 7px; }
.icon.mini svg { width: 15px; height: 15px; }
.icon.big { width: 52px; height: 52px; border-radius: 13px; }
.icon.big svg { width: 28px; height: 28px; }
.pack.on .icon, .sheet-head .icon { background: var(--yellow); color: var(--on-yellow); }
.pack.on .icon.brand, .sheet-head .icon.brand, .chip .icon.brand { background: #fdfdf8; box-shadow: inset 0 0 0 1.5px var(--yellow); }
.pack:not(.on) .icon.brand svg { filter: grayscale(1); opacity: 0.65; }

.extend { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 20px; align-items: start; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; align-items: stretch; }
.pack { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; min-width: 0; display: grid; grid-template-rows: 1fr auto; }
.pack:hover { border-color: var(--muted); }
.pack.on { border-color: var(--edge); box-shadow: 0 4px 0 var(--shadow); }
.pack-open { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px 12px; align-items: center; align-content: start; text-align: left; background: none; border: 0; border-radius: 12px; padding: 14px 16px 10px; min-width: 0; }
.pack-name { font: 700 1.08rem/1.15 var(--f-body); display: flex; align-items: center; gap: 6px; min-width: 0; }
.pack-name svg { width: 15px; height: 15px; color: var(--muted); flex: none; transition: transform 0.15s; }
.pack-open:hover .pack-name svg, .pack-open:focus-visible .pack-name svg { color: var(--fg); transform: translateX(3px); }
.pack-sum { grid-column: 1 / -1; font-size: 0.92rem; color: var(--muted); }
.pack-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px; min-height: 26px; }
.badge.hub { background: var(--accent-soft); color: var(--fg); }
.pick { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-left: auto; padding: 2px 0; }
.pick input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
.install { position: sticky; top: 16px; display: grid; gap: 10px; min-width: 0; }
.install pre { max-height: min(52vh, 460px); overflow-y: auto; }
.aud { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
.tray { display: none; }
.status { font: 0.76rem/1.5 var(--f-mono); color: var(--muted); }

dialog { color: var(--fg); }
#pack-sheet { width: min(920px, calc(100vw - 32px)); max-width: none; height: min(720px, 88dvh); max-height: none; padding: 0; border: 1.5px solid var(--edge); border-radius: 14px; background: var(--surface); box-shadow: 0 6px 0 var(--shadow), 0 30px 80px rgb(0 0 0 / 0.3); overflow: hidden; }
#pack-sheet[open] { display: flex; flex-direction: column; }
#pack-sheet::backdrop { background: rgb(21 21 21 / 0.6); }
.sheet-head { display: flex; align-items: center; gap: 14px; padding: 18px 18px 14px 24px; flex: none; }
.sheet-title { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sheet-title h2 { font-size: 1.6rem; }
.sheet-x { width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: var(--sunk); border: 0; border-radius: 8px; color: var(--muted); }
.sheet-x:hover { color: var(--fg); }
.sheet-x svg { width: 17px; height: 17px; }
.sheet-tabs { display: flex; gap: 4px; padding-inline: 24px; border-bottom: 1.5px solid var(--edge); flex: none; overflow-x: auto; }
.sheet-tabs [role="tab"] { background: none; border: 1.5px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 8px 14px; font-weight: 600; font-size: 0.94rem; color: var(--muted); white-space: nowrap; margin-bottom: -1.5px; }
.sheet-tabs [role="tab"]:hover { color: var(--fg); }
.sheet-tabs [role="tab"][aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--edge); border-bottom: 1.5px solid var(--bg); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 18px; align-content: start; padding: 22px 24px 28px; background: var(--bg); }
.sheet-lede { font-size: 1.22rem; line-height: 1.4; font-weight: 500; max-width: 46ch; text-wrap: balance; }
.sheet-body .where-map { max-width: 420px; }
.flow { list-style: none; padding: 16px; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.flow li { display: flex; align-items: center; gap: 10px; font: 600 0.88rem/1.3 var(--f-body); }
.flow li + li::before { content: ""; width: 20px; height: 10px; flex: none; background: var(--fg); clip-path: polygon(0 40%, 62% 40%, 62% 0, 100% 50%, 62% 100%, 62% 60%, 0 60%); }
.flow-step { background: var(--surface); border: 1.5px solid var(--edge); border-radius: 8px; padding: 7px 11px; box-shadow: 0 2px 0 var(--shadow); }
.flow li:last-child .flow-step { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow-edge); box-shadow: 0 2px 0 var(--yellow-edge); }
.example { display: grid; gap: 6px; justify-items: start; border-left: 4px solid var(--yellow); padding: 2px 0 2px 14px; max-width: 65ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.fact { display: grid; gap: 4px; align-content: start; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 0.93rem; min-width: 0; }
.fact-big { font: 700 1.5rem/1.2 var(--f-body); letter-spacing: -0.01em; }
.link { background: none; border: 0; padding: 0; color: var(--link); font-weight: 600; font-size: 0.9rem; text-decoration: underline; text-underline-offset: 2px; }
.warn { display: grid; gap: 4px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 12px 14px; font-size: 0.93rem; }
.warn .eyebrow { color: inherit; }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.sub > summary { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; padding-block: 6px; color: var(--muted); }
.sub > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.7px solid currentColor; border-bottom: 1.7px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; flex: none; }
.sub[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.sub > summary:hover { color: var(--fg); }
.switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; background: var(--line); border: 0; box-shadow: inset 0 0 0 1.5px var(--muted); transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch.small { width: 36px; height: 21px; margin-top: 2px; }
.switch.small::after { width: 15px; height: 15px; }
.switch.small[aria-checked="true"]::after { transform: translateX(15px); }
.switch:disabled { opacity: 0.45; cursor: not-allowed; }
.wfs { display: grid; gap: 10px; }
.wf { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.wf-off { background: transparent; }
.wf-body { min-width: 0; flex: 1; display: grid; gap: 4px; }
.wf-name { font-weight: 700; font-size: 1rem; }
.wf-sentence { font-size: 0.93rem; max-width: 65ch; }
.risk > summary { color: var(--warn-fg); }
.wf-off .wf-name, .wf-off .wf-sentence { color: var(--muted); }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.need { font: 500 0.72rem/1.5 var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 6px; }
.need.miss { color: var(--warn-fg); background: var(--warn-bg); border-style: solid; border-color: transparent; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.setting { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; font-size: 0.9rem; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.setting p:first-child { font-weight: 500; }
.aud { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }

.foot { border-top: 1px solid var(--line); padding-block: 28px 56px; font-size: 0.9rem; color: var(--muted); }

@media (max-width: 960px) {
  .hero { padding-block: 32px 28px; }
  .hero-in, .console-body, .extend { grid-template-columns: minmax(0, 1fr); }
  .hero-in { gap: 24px; }
  .band { padding-block: 36px; }
  .paste { border-left: 0; border-top: 1.5px solid var(--edge); }
  .paste .out { order: -1; }
  .install { position: static; }
  .tray { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: fixed; inset: auto 0 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1.5px solid var(--edge); font-weight: 600; }
  .has-tray .foot { padding-bottom: 96px; }
}
@media (max-width: 560px) {
  .wheres { grid-template-columns: minmax(0, 1fr); }
  .where + .where { border-left: 0; }
  .where.on { border-bottom-color: var(--edge); }
  .where { padding: 13px 16px; }
  .setup, .paste { padding: 18px 16px 20px; }
  .overview img { width: 640px; max-width: none; }
  .top nav a:first-child { display: none; }
  #pack-sheet { width: 100vw; height: 92dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; border-width: 1.5px 0 0; box-shadow: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-head { padding: 14px 12px 12px 16px; gap: 10px; flex-wrap: wrap; }
  .sheet-pick { order: 3; flex: 1 1 100%; }
  .sheet-title h2 { font-size: 1.3rem; }
  .icon.big { width: 44px; height: 44px; }
  .sheet-tabs { padding-inline: 16px; }
  .sheet-tabs [role="tab"] { padding-inline: 10px; }
  .sheet-body { padding: 18px 16px 24px; }
  .sheet-lede { font-size: 1.1rem; }
  .flow { flex-direction: column; align-items: flex-start; }
  .flow li { flex-direction: column; align-items: flex-start; }
  .flow li + li::before { transform: rotate(90deg); margin-left: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  html { scroll-behavior: auto; }
}

ell guards on, gh follows the same list.","needs":["devbox"],"default":false,"risk":"Git refuses every remote outside the signed list, including other hosts than GitHub. Root, or anyone with sudo, can remove it. It stops mistakes, not a hostile agent. An agent that runs as you can override it with its own Git config, or edit the staged script before you run it with sudo."},{"id":"package-age","name":"Package age","sentence":"Package installs through pnpm and Bun take only versions at least three days old, unless a project or you set another age.","needs":[],"default":false},{"id":"oom-survival","name":"OOM survival","sentence":"Before memory runs out, earlyoom stops a runaway test or build, and T3's agent threads survive when the kernel kills a process inside them.","needs":["devbox"],"default":false}],"settings":[{"key":"guards.person","question":"Whom should a refusal tell the agent to ask, such as your first name?","type":"string","default":"the person who runs this machine","ask":"never"},{"key":"guards.owners","question":"Which GitHub owners may agents use, separated by commas, such as you,your-org?","type":"string","optional":true,"ask":"never"},{"key":"guards.main-push-repos","question":"Which GitHub repositories take pushes straight to main or master, as owner/name separated by commas?","type":"string","optional":true,"ask":"never"},{"key":"guards.signers","question":"Which SSH public keys may sign the Git allowlist, one per line?","type":"string","optional":true,"ask":"never"}]},{"name":"slack","title":"Slack","summary":"Your own message, reaction, or mention in Slack starts a T3 thread about it.","day":"A teammate reports a bug in a Slack thread. You react with :t3code:, and a thread starts to find the cause, with the whole Slack thread as its context.","cost":"You need your own Slack app, which you make from a manifest in a few minutes. One small process stays connected to Slack.","risk":"Your Slack messages and the threads they belong to become agent prompts. Only your own messages, reactions, and mentions start a thread, and the prompt treats the rest of the Slack thread as data.","requires":[],"always":false,"setupNote":"~/.local/share/fleet/engine/packs/slack/SETUP.md","workflows":[{"id":"slack-thread","name":"Start a thread from Slack","sentence":"Your own Slack message with :t3code:, your :t3code: reaction, or a mention of your Slack app starts a T3 thread, and Slack shows you its link.","needs":[],"default":false,"risk":"Your Slack messages and the threads they belong to become agent prompts. Only your own messages, reactions, and mentions start a thread."}],"settings":[{"key":"slack.userId","type":"string","question":"What is your Slack member ID, so only your own messages start threads? In Slack, open your profile, then More, then Copy member ID."}]},{"name":"hub","title":"Hub","summary":"One always-on devbox manages the others. It keeps your devboxes linked and watches their disks.","day":"A thread on one devbox starts work on another, and the hub cleans a devbox that fills its disk before you notice.","cost":"You need one devbox that stays on, and some setup on it. Every other machine keeps working when the hub is down.","risk":"The hub holds sign-ins for your MCP servers and reaches every devbox over SSH. Keep it as private as your laptop.","requires":[],"always":false,"setupNote":"~/.local/share/fleet/engine/packs/hub/SETUP.md","workflows":[{"id":"disk-watch","name":"Disk watch","sentence":"The hub cleans a devbox whose disk runs low with fleet prune and each tool's own cache cleaner, and names the largest folders only when that cannot free enough.","needs":["hub"],"default":true,"risk":"The sweep deletes only this. Through fleet prune: worktrees idle for 6 hours, or 24 when no T3 thread or agent owns them, whose commits are on the default branch or in a merged pull request, whose T3 thread is closed, or whose agent has been idle for a day. Their commits stay on their branch, but their lockfile and tool h unauthorized means, including services that route requests through consumer subscriptions or misrepresent the product or client being used\". The Anthropic Consumer Terms, effective Oct 8, 2025, section 2 (https://www.anthropic.com/legal/consumer-terms), say: \"You may not share your Account login information, Anthropic API key, or Account credentials with anyone else. You also may not make your Account available to anyone else.\" Section 3, item 7 of the same terms lists: \"Except when you are accessing our Services via an Anthropic API Key or where we otherwise explicitly permit it, to access the Services through automated or non-human means, whether through a bot, script, or otherwise.\" Balancing is only for your own subscriptions, never for someone else's."}],"settings":[{"key":"hub.alias","question":"What is the SSH name of your hub, the always-on devbox that manages the others, such as my-hub?","type":"string"},{"key":"hub.diskSweepGigabytes","question":"Below how many free gigabytes does the hub clean a devbox's disk?","type":"number","default":15,"ask":"never"},{"key":"hub.diskAlertGigabytes","question":"Below how many free gigabytes after a cleanup does the hub tell you?","type":"number","default":10,"ask":"never"},{"key":"hub.httpsHost","question":"Which private host name does a browser on your own computer use to open the hub's sign-in pages over HTTPS, such as hub.internal.example.com? Devboxes always reach the hub through their SSH tunnels. Leave it empty to skip HTTPS.","type":"string","optional":true,"ask":"never"},{"key":"hub.relayPort","question":"Which port on the hub do the SSH tunnels from your devboxes use?","type":"number","default":60001,"ask":"never"},{"key":"hub.dreamSessions","question":"How many sessions may one Dream run send to an analyst model? Each one spends model tokens.","type":"number","default":150,"ask":"never"},{"key":"hub.threadFolder","question":"Which folder do the hub's threads start in, such as ~/notes? The hub starts it
