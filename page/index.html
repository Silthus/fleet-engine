<!doctype html>
<html lang="en">

<style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e8ecf2;
  --fg: #131c2b;
  --muted: #556074;
  --line: #d2d9e3;
  --accent: #2747d4;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fd;
  --day: #c98300;
  --night: #dde2f1;
  --warn-bg: #fff3d9;
  --warn-fg: #6f4400;
  --code-bg: #0f1724;
  --code-fg: #dbe4f3;
  --slack-red: #e01e5a;
  --slack-blue: #36c5f0;
  --slack-green: #2eb67d;
  --slack-yellow: #ecb22e;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131c; --surface: #151d2a; --sunk: #1d2737; --fg: #e7ecf4; --muted: #9ba7ba; --line: #2b3649;
    --accent: #8ea9ff; --accent-ink: #0b1220; --accent-soft: #1c2946; --day: #f2c14e; --night: #070b13;
    --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #070b12; --code-fg: #dbe4f3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131c; --surface: #151d2a; --sunk: #1d2737; --fg: #e7ecf4; --muted: #9ba7ba; --line: #2b3649;
  --accent: #8ea9ff; --accent-ink: #0b1220; --accent-soft: #1c2946; --day: #f2c14e; --night: #070b13;
  --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #070b12; --code-fg: #dbe4f3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.4vw, 3.05rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: clamp(1.45rem, 3vw, 1.95rem); font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 700; }
h4 { font-size: 1.08rem; font-weight: 700; }
p, ul, ol { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--sunk); padding: 0.05em 0.35em; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
svg { display: block; }
.eyebrow { font: 600 0.72rem/1.2 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.prose { max-width: 65ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.badge { font: 600 0.68rem/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }

.hero { padding-block: 44px 30px; }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 36px; align-items: end; }
.hero-copy { display: grid; gap: 16px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 58ch; }
.route { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.route a { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 500; font-size: 0.94rem; }
.route a:hover { border-color: var(--accent); }
.route b { font: 500 0.78rem var(--f-mono); width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.daycard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.daycount { font: 500 1rem var(--f-display); color: var(--muted); }
.daycount b { font-size: 2.3rem; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; margin-right: 4px; font-variant-numeric: tabular-nums; }
.daynote { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.daynote a { margin-left: auto; font-weight: 600; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key .dot { width: 9px; }
.ribbon { display: grid; gap: 6px; }
.ribbon-track { display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); align-items: end; height: 58px; padding-bottom: 5px; border-bottom: 1.5px solid var(--fg); border-radius: 8px 8px 0 0; background: linear-gradient(90deg, var(--night) 0 25%, transparent 25% 83.33%, var(--night) 83.33%); }
.bin { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; min-width: 0; }
.dot { display: block; width: min(100%, 9px); aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--muted); opacity: 0.55; }
.dot.lit { background: var(--day); border-color: var(--day); opacity: 1; }
.ribbon-hours { position: relative; height: 1.2em; font: 0.68rem/1.2 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ribbon-hours span { position: absolute; top: 0; }
.ribbon-hours .mid { transform: translateX(-50%); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-block: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 8px 16px; padding-block: 8px; min-height: 54px; }
.bar-picks { display: flex; flex-wrap: wrap; gap: 4px 8px; flex: 1; min-width: 0; font-size: 0.86rem; }
.bar-picks a { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 500; }
.bar-picks a:hover { border-color: var(--accent); }
.bar-picks svg { width: 15px; height: 15px; color: var(--muted); }
.cta { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 0.92rem; text-decoration: none; }
.cta svg { width: 15px; height: 15px; }

.step { padding-block: 44px; border-top: 1px solid var(--line); display: grid; gap: 20px; }
main > .step:first-child { border-top: 0; }
.step-head { display: flex; gap: 14px; align-items: flex-start; }
.step-head > div { display: grid; gap: 6px; min-width: 0; }
.step-n { font: 500 0.95rem var(--f-mono); width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; flex: none; margin-top: 2px; }

.wheres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; border: 0; padding: 0; margin: 0; min-width: 0; }
.where { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; align-content: start; cursor: pointer; min-width: 0; }
.where:hover { border-color: var(--muted); }
.where.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.where-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.where-top input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.where-top label { font: 700 1.2rem/1.2 var(--f-display); cursor: pointer; flex: 1; min-width: 0; }
.where ul { padding-left: 1.15em; display: grid; gap: 6px; font-size: 0.94rem; }
.where-map { width: 100%; height: auto; }
.d-zone { fill: var(--sunk); stroke: none; }
.d-zone-t { fill: var(--muted); font: 500 10px var(--f-mono); }
.d-node { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.d-ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; }
.d-txt { fill: var(--fg); font: 600 13px var(--f-body); }
.d-small { fill: var(--muted); font: 10.5px var(--f-body); }
.d-faint { opacity: 0.55; }
.d-link { stroke: var(--accent); stroke-width: 2; fill: none; }
.d-nolink { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; opacity: 0.6; }

.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.preset { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.preset:hover { border-color: var(--muted); }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.preset-name { font: 700 1.15rem/1.2 var(--f-display); }
.preset-blurb { font-size: 0.88rem; color: var(--muted); }
.preset-icons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.preset-count { font: 0.74rem var(--f-mono); color: var(--muted); }
.preset-state { font-size: 0.9rem; }

.icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); flex: none; }
.icon svg { width: 22px; height: 22px; }
.icon.mini { width: 26px; height: 26px; border-radius: 7px; }
.icon.mini svg { width: 15px; height: 15px; }
.pack.on .pack-head .icon { background: var(--accent); color: var(--accent-ink); }
.pack.on .pack-head .icon.brand { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
.pack:not(.on) .pack-head .icon.brand svg { filter: grayscale(1); opacity: 0.65; }

.group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; }
.group-head p { font-size: 0.92rem; flex: 1 1 240px; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
.pack { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 0; display: grid; gap: 8px; min-width: 0; }
.pack.on { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.pack.locked { border-style: dashed; background: transparent; }
.pack.locked .pack-head .icon, .pack.locked h4 { opacity: 0.6; }
.pack-head { display: flex; align-items: center; gap: 12px; }
.pack-head h4 { flex: 1; min-width: 0; }
.pack-sum { font-size: 0.93rem; color: var(--muted); }
.pack.on .pack-sum { color: var(--fg); }
.pack-body { display: grid; gap: 12px; padding-bottom: 14px; font-size: 0.93rem; }
.status { font: 0.76rem/1.5 var(--f-mono); color: var(--muted); }
.status.live { color: var(--accent); }
.status.none { color: var(--warn-fg); background: var(--warn-bg); padding: 0 6px; border-radius: 4px; }
.fact { display: grid; gap: 4px; }
.fact.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 10px 12px; }
.fact.warn .eyebrow { color: inherit; }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.more > summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line); }
.cue { font-size: 0.84rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.cue::after, .sub > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.7px solid currentColor; border-bottom: 1.7px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; flex: none; }
details[open] > summary .cue::after, .sub[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.sub > summary { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; padding-block: 6px; color: var(--muted); }
.risk > summary { font-size: 0.84rem; padding-block: 2px; color: var(--warn-fg); }
.risk > .warnbox { margin-top: 6px; }
.sub > summary:hover, .more > summary:hover .cue { color: var(--fg); }

.switch { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: var(--line); border: 0; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch.small { width: 36px; height: 21px; margin-top: 2px; }
.switch.small::after { width: 15px; height: 15px; }
.switch.small[aria-checked="true"]::after { transform: translateX(15px); }
.switch:disabled { opacity: 0.45; cursor: not-allowed; }
.wfs { display: grid; }
.wf { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.wf-body { min-width: 0; flex: 1; display: grid; gap: 4px; }
.wf-name { font-weight: 600; }
.wf-off .wf-name, .wf-off .wf-sentence { color: var(--muted); }
.wf-hint { font-size: 0.85rem; color: var(--muted); }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.need { font: 500 0.72rem/1.5 var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 6px; }
.need.miss { color: var(--warn-fg); background: var(--warn-bg); border-style: solid; border-color: transparent; }
.warnbox { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; padding-block: 8px 4px; }
.setting { display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; min-width: 0; }
.setting label { color: var(--muted); }
.setting input, .setting select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
.setting input[aria-invalid="true"] { border-color: var(--warn-fg); outline-color: var(--warn-fg); }
.mark { font-weight: 600; }
.mark.changed { color: var(--accent); }
.aud { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }

.btn-line { background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 0.88rem; font-weight: 600; }
.btn-line:hover { background: var(--accent-soft); }
.btn-solid { background: var(--code-fg); color: var(--code-bg); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; color: var(--code-fg); border: 1px solid color-mix(in srgb, var(--code-fg) 35%, transparent); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
.btn-ghost svg { width: 15px; height: 15px; }

.steps { list-style: none; counter-reset: step; padding: 0; display: grid; gap: 26px; max-width: 780px; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px 12px; }
.steps > li::before { content: counter(step); grid-column: 1; grid-row: 1 / span 6; font: 500 1.05rem/1.3 var(--f-mono); color: var(--accent); }
.steps > li > * { grid-column: 2; min-width: 0; }
#start-out { display: grid; gap: 12px; margin-top: 6px; }
.agent-steps { padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.94rem; padding-block: 4px 8px; }
.out { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; overflow: hidden; }
.out-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 12px 16px 0; font-size: 0.8rem; }
.out-title { font: 600 0.72rem/1.4 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; }
.out-picks { opacity: 0.75; font-family: var(--f-mono); }
.out-tabs { display: flex; gap: 2px; padding: 6px 6px 0; }
.out-tab { background: transparent; border: 0; color: var(--code-fg); opacity: 0.6; padding: 8px 12px; border-radius: 8px 8px 0 0; font: 500 0.85rem var(--f-mono); }
.out-tab[aria-selected="true"] { opacity: 1; background: color-mix(in srgb, var(--code-fg) 9%, transparent); }
.out pre { margin: 0; padding: 14px 16px; font: 0.84rem/1.65 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.out-tabs + pre { background: color-mix(in srgb, var(--code-fg) 5%, transparent); }
.out-foot { display: flex; align-items: center; gap: 10px; padding: 4px 16px 14px; font-size: 0.82rem; flex-wrap: wrap; }
.out-note { opacity: 0.85; flex: 1 1 240px; }
.out code { background: color-mix(in srgb, var(--code-fg) 14%, transparent); color: inherit; }
.out a:not(.btn-ghost) { color: inherit; }

.line { display: grid; }
.divider { padding-block: 18px 6px; }
.empty { padding-block: 8px; }
.moment { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 240px); gap: 20px; padding-block: 16px; border-top: 1px solid var(--line); }
.moment-body { display: grid; gap: 6px; min-width: 0; align-content: start; }
.time { font: 500 1.02rem var(--f-mono); color: var(--day); font-variant-numeric: tabular-nums; }
.night .time { color: var(--accent); }
.src { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); }
.notes { display: grid; gap: 8px; align-content: start; justify-items: start; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.86rem; display: grid; gap: 2px; }
.note b { font-family: var(--f-display); }
.wait { padding-block: 12px; align-items: center; }
.wait .time, .wait h4 { color: var(--muted); }
.wait h4 { font-size: 1rem; }
.rest { margin-top: 8px; }
.foot { border-top: 1px solid var(--line); padding-block: 28px 56px; font-size: 0.9rem; color: var(--muted); }

@media (max-width: 860px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .hero { padding-block: 32px 24px; }
  .presets, .wheres { grid-template-columns: minmax(0, 1fr); }
  .moment { grid-template-columns: 52px minmax(0, 1fr); gap: 8px 12px; }
  .moment .notes { grid-column: 2; }
  .moment .notes:empty { display: none; }
  .bar-day { display: none !important; }
  .step { padding-block: 32px; }
}
@media (max-width: 480px) {
  .bar-in { gap: 8px; }
  .bar-picks { flex-wrap: nowrap; gap: 6px; font-size: 0.8rem; }
  .bar-picks a { white-space: nowrap; min-width: 0; padding-inline: 8px; }
  .bar-picks a span { overflow: hidden; text-overflow: ellipsis; }
  .bar-picks svg, .cta svg { display: none; }
  .cta { padding-inline: 12px; font-size: 0.86rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>

  return `<button class="btn-line" data-act="pack" data-id="${esc(pack.name)}" ${keys}>Add the ${esc(pack.title)} pack</button>`;
}
var momentSource = (item) => `<div class="src">${iconTile(item.pack.name, "mini")}<span>${esc(item.pack.title)} · ${esc(item.workflow.name)}</span></div>`;
function daySection() {
  const seen = new Set;
  const row = (item) => {
    const words = (item.moment.words ?? []).filter((word) => !seen.has(word)).map((word) => data.concepts.find((concept) => concept.word === word)).filter((concept) => !!concept);
    words.forEach((concept) => seen.add(concept.word));
    return `<article class="moment ${item.moment.night ? "night" : ""}" data-focus="moment:${esc(item.workflow.id)}" tabindex="-1">
      <div class="time">${esc(item.moment.time)}</div>
      <div class="moment-body"><h4>${esc(item.moment.title)}</h4><p>${fmt(item.moment.body)}</p>${momentSource(item)}
        ${riskNote(`dayrisk:${item.workflow.id}`, item.workflow.risk)}
      </div>
      <div class="notes">${words.map((concept) => `<div class="note"><span class="eyebrow">New word</span><b>${esc(concept.word)}</b><span>${fmt(concept.note)}</span></div>`).join("")}</div>
    </article>`;
  };
  const waiting = (item) => `<article class="moment wait" data-focus="moment:${esc(item.workflow.id)}" tabindex="-1">
      <div class="time">${esc(item.moment.time)}</div>
      <div class="moment-body"><h4>${esc(item.moment.title)}</h4>${momentSource(item)}</div>
      <div class="notes">${fixButton(item)}</div>
    </article>`;
  const on = moments.filter(isOn);
  const off = moments.filter((item) => !isOn(item));
  const part = (title, items, empty) => `<h3 class="divider eyebrow">${title}</h3>${items.map(row).join("") || `<p class="muted empty">${empty}</p>`}`;
  return `<section id="day" class="step" aria-labelledby="day-h">
    <header class="step-head"><div><h2 id="day-h">A day with your picks</h2><p class="muted prose">${on.length} of ${plural(moments.length, "moment")}. Each one comes from a workflow in a pack you picked.</p></div></header>
    <div class="line">
      ${part("Daytime", on.filter((item) => !item.moment.night), "No daytime moment with these picks.")}
      ${part("While you sleep", on.filter((item) => item.moment.night), "Nothing runs at night with these picks.")}
    </div>
    ${off.length ? `<details class="sub rest" ${open("day:rest")}><summary>${plural(off.length, "more moment")} with other picks</summary><div class="line">${off.map(waiting).join("")}</div></details>` : ""}
  </section>`;
}
function footer() {
  return `<footer class="foot"><div class="wrap"><p>Fleet is open source. Read the code and the docs at <a href="https://github.com/${esc(data.engineRepo)}" target="_blank" rel="noopener">github.com/${esc(data.engineRepo)}</a>.</p></div></footer>`;
}
var focusOf = () => {
  const active = document.activeElement;
  return active instanceof HTMLElement ? [active.dataset.focus, active.dataset.fallback] : [];
};
function restoreFocus(keys) {
  for (const key of keys) {
    const target = key ? document.querySelector(`[data-focus="${CSS.escape(key)}"]`) : null;
    if (!target || target.disabled)
      continue;
    target.focus({ preventScroll: true });
    return;
  }
}
var rememberOpened = () => opened = new Set([...document.querySelectorAll("details[data-open][open]")].map((details) => details.dataset.open));
function render() {
  const focus = focusOf();
  const top = window.scrollY;
  rememberOpened();
  document.getElementById("app").innerHTML = `${hero()}${bar()}<main class="wrap">${whereSection()}${packsSection()}${startSection()}${daySection()}</main>${footer()}`;
  window.scrollTo(0, top);
  restoreFocus(focus);
}
function refreshOutputs() {
  const focus = focusOf();
  rememberOpened();
  const out = document.getElementById("start-out");
  if (out)
    out.innerHTML = startOut();
  restoreFocus(focus);
}
function copy(button, id) {
  const text = document.getElementById(id);
  const select = () => {
    const range = document.createRange();
    range.selectNodeContents(text);
    const selection = window.getSelection();
    selection?.removeAllRanges();
    selection?.addRange(range);
    button.textContent = "Selected: press Ctrl-C or ⌘C";
  };
  if (!navigator.clipboard)
    return select();
  navigator.clipboard.writeText(text.textContent ?? "").then(() => button.textContent = "Copied", select);
}
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-act]");
  if (!target || target.disabled)
    return;
  const { act, id = "" } = target.dataset;
  if (act === "copy")
    return copy(target, id);
  if (act === "tab") {
    tab = id === "profile" ? "profile" : "command";
    return refreshOutputs();
  }
  if (act === "where") {
    const where = id === "hub" ? "hub" : "mac";
    if (picks.where === where)
      return;
    picks = setWhere(data, picks, where);
  }
  if (act === "preset")
    picks = presetPicks(data, id, picks.settings, picks.where);
  if (act === "pack")
    picks = togglePack(data, picks, id);
  if (act === "wf")
    picks = toggleWorkflow(data, picks, id);
  render();
});
function onSetting(event, committed) {
  const input = event.target;
  const key = input.dataset?.key;
  const setting = key && data.packs.flatMap((pack) => pack.settings).find((item) => item.key === key);
  if (!setting)
    return;
  const text = input.value.trim();
  let value;
  try {
    value = text === "" ? undefined : parseSettingValue(setting, text);
  } catch (error) {
    input.setAttribute("aria-invalid", "true");
    input.title = error.message;
    return;
  }
  input.removeAttribute("aria-invalid");
  input.removeAttribute("title");
  picks = setSetting(data, picks, setting.key, value);
  if (committed && input instanceof HTMLInputElement)
    input.value = value === undefined ? "" : String(value);
  refreshMarks();
  refreshOutputs();
}
document.addEventListener("input", (event) => onSetting(event, false));
document.addEventListener("change", (event) => onSetting(event, true));
render();
</script>
</body>
</html>
