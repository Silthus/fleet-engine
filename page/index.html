<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up Fleet</title>
<meta name="description" content="Choose where Fleet runs and which packs you want, read what each pack does, and copy one prompt that sets it all up.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%20role%3D%22img%22%20aria-label%3D%22Fleet%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%23f1a82c%22%20stroke%3D%22%23151515%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20fill%3D%22%23151515%22%20d%3D%22M16.5%209.5%2027%2016l-10.5%206.5%202.6-6.5-2.6-6.5ZM6%205.5%2014.5%2010%206%2014.5l2-4.5-2-4.5ZM6%2017.5%2014.5%2022%206%2026.5l2-4.5-2-4.5Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eeefe9;
  --surface: #fdfdf8;
  --sunk: #e5e7e0;
  --fg: #151515;
  --muted: #5c5d56;
  --line: #d0d1c9;
  --edge: #151515;
  --shadow: #151515;
  --accent: #1d4aff;
  --accent-ink: #ffffff;
  --accent-soft: #dde4ff;
  --link: #b83a00;
  --yellow: #f1a82c;
  --on-yellow: #151515;
  --yellow-edge: #151515;
  --warn-bg: #fbebc8;
  --warn-fg: #6a4500;
  --code-bg: #151515;
  --code-fg: #eeefe9;
  --code-line: #151515;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --surface: #1f1f1f; --sunk: #2c2c2c; --fg: #eeefe9; --muted: #a9aaa2; --line: #4b4b4b;
    --edge: #eeefe9; --shadow: #000000; --accent: #8aa2ff; --accent-ink: #0b1220; --accent-soft: #1e2747; --link: #ff8a52;
    --yellow-edge: #a8700f; --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #0b0b0b; --code-line: #4b4b4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --surface: #1f1f1f; --sunk: #2c2c2c; --fg: #eeefe9; --muted: #a9aaa2; --line: #4b4b4b;
  --edge: #eeefe9; --shadow: #000000; --accent: #8aa2ff; --accent-ink: #0b1220; --accent-soft: #1e2747; --link: #ff8a52;
  --yellow-edge: #a8700f; --warn-bg: #3a2c10; --warn-fg: #f5d69a; --code-bg: #0b0b0b; --code-line: #4b4b4b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 16px; }
html:has(dialog[open]) { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-body); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: clamp(1.45rem, 3vw, 1.95rem); font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 700; }
p, ul, ol { margin: 0; }
a { color: var(--link); font-weight: 600; text-underline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--sunk); padding: 0.05em 0.35em; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
svg { display: block; }
.eyebrow { font: 600 0.72rem/1.2 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.prose { max-width: 65ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.badge { font: 600 0.68rem/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }

.hero { padding-block: 36px 28px; }
.hero-in { display: grid; gap: 20px; }
.wordmark { display: flex; align-items: center; gap: 10px; font: 700 1.35rem/1 var(--f-body); letter-spacing: -0.01em; }
.wordmark svg { width: 38px; height: 38px; }
.hero h1 { max-width: 21ch; }
.pitch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pitch > div { display: grid; gap: 8px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 1.02rem; }
.pitch > div + div { border-color: var(--edge); box-shadow: 0 4px 0 var(--shadow); }
.overview { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.overview img { display: block; width: 100%; max-width: 760px; height: auto; margin-inline: auto; }
.route a, .btn-line, .btn-solid { border: 1.5px solid var(--edge); border-radius: 8px; box-shadow: 0 3px 0 var(--shadow); font-weight: 700; transition: transform 0.1s, box-shadow 0.1s; }
.route a:hover, .btn-line:hover, .btn-solid:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--shadow); }
.route a:active, .btn-line:active, .btn-solid:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.route { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 4px; }
.route a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 9px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 0.95rem; }
.route b { font: 500 0.78rem var(--f-mono); width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.route a.go, .btn-solid { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow-edge); box-shadow: 0 3px 0 var(--yellow-edge); }
.route a.go:hover, .btn-solid:hover { box-shadow: 0 4px 0 var(--yellow-edge); }
.route a.go:active, .btn-solid:active { box-shadow: 0 1px 0 var(--yellow-edge); }
.route a.go b { background: var(--on-yellow); color: var(--yellow); }
.step { padding-block: 44px; border-top: 1px solid var(--line); display: grid; gap: 20px; }
main > .step:first-child { border-top: 0; }
.step-head { display: flex; gap: 14px; align-items: flex-start; }
.step-head > div { display: grid; gap: 6px; min-width: 0; }
.step-n { font: 500 0.95rem var(--f-mono); width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; flex: none; margin-top: 2px; }

.wheres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; border: 0; padding: 0; margin: 0; min-width: 0; }
.where { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; cursor: pointer; min-width: 0; }
.where:hover { border-color: var(--muted); }
.where.on { border-color: var(--edge); box-shadow: 0 4px 0 var(--shadow); }
.where.on .badge { background: var(--yellow); color: var(--on-yellow); }
.where-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.where-top input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.where-top label { font: 700 1.2rem/1.2 var(--f-body); cursor: pointer; flex: 1; min-width: 0; }
.where ul { padding-left: 1.15em; display: grid; gap: 6px; font-size: 0.94rem; }
.where-map { width: 100%; height: auto; }
.d-zone { fill: var(--sunk); stroke: none; }
.d-zone-t { fill: var(--muted); font: 500 10px var(--f-mono); }
.d-node { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.d-ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; }
.d-txt { fill: var(--fg); font: 600 13px var(--f-body); }
.d-small { fill: var(--muted); font: 10.5px var(--f-body); }
.d-faint { opacity: 0.8; }
.d-link { stroke: var(--accent); stroke-width: 2; fill: none; }
.d-nolink { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; opacity: 0.6; }

.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.preset { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.preset:hover { border-color: var(--muted); }
.preset[aria-pressed="true"] { border-color: var(--edge); box-shadow: 0 4px 0 var(--shadow); }
.preset-name { font: 700 1.15rem/1.2 var(--f-body); }
.preset-blurb { font-size: 0.88rem; color: var(--muted); }
.preset-icons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.preset-count { font: 0.74rem var(--f-mono); color: var(--muted); }
.preset-state { font-size: 0.9rem; }

.icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); flex: none; }
.icon svg { width: 22px; height: 22px; }
.icon.mini { width: 26px; height: 26px; border-radius: 7px; }
.icon.mini svg { width: 15px; height: 15px; }
.icon.big { width: 52px; height: 52px; border-radius: 13px; }
.icon.big svg { width: 28px; height: 28px; }
.pack.on .icon, .sheet-head .icon, .preset[aria-pressed="true"] .icon { background: var(--yellow); color: var(--on-yellow); }
.pack.on .icon.brand, .sheet-head .icon.brand, .preset[aria-pressed="true"] .icon.brand { background: #fdfdf8; box-shadow: inset 0 0 0 1.5px var(--yellow); }
.pack:not(.on) .icon.brand svg { filter: grayscale(1); opacity: 0.65; }

.group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; }
.group-head p { font-size: 0.92rem; flex: 1 1 240px; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
.pack { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; min-width: 0; display: grid; }
.pack:hover { border-color: var(--muted); }
.pack.on { border-color: var(--edge); }
.pack.locked { border-style: dashed; background: transparent; }
.pack.locked .icon, .pack.locked .pack-name { opacity: 0.6; }
.pack-open { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px 12px; align-items: center; align-content: start; text-align: left; background: none; border: 0; border-radius: 12px; padding: 14px 16px 16px; min-width: 0; }
.pack-name { font: 700 1.08rem/1.15 var(--f-body); display: flex; align-items: center; gap: 6px; padding-right: 96px; min-width: 0; }
.pack-name svg { width: 15px; height: 15px; color: var(--muted); flex: none; transition: transform 0.15s; }
.pack-open:hover .pack-name svg, .pack-open:focus-visible .pack-name svg { color: var(--fg); transform: translateX(3px); }
.pack-sum { grid-column: 1 / -1; font-size: 0.93rem; color: var(--muted); }
.pack.on .pack-sum { color: var(--fg); }
.pack-ctl { position: absolute; top: 21px; right: 16px; display: flex; }
.status { font: 0.76rem/1.5 var(--f-mono); color: var(--muted); }

dialog { color: var(--fg); }
#pack-sheet { width: min(920px, calc(100vw - 32px)); max-width: none; height: min(720px, 88dvh); max-height: none; padding: 0; border: 1.5px solid var(--edge); border-radius: 14px; background: var(--surface); box-shadow: 0 6px 0 var(--shadow), 0 30px 80px rgb(0 0 0 / 0.3); overflow: hidden; }
#pack-sheet[open] { display: flex; flex-direction: column; }
#pack-sheet::backdrop { background: rgb(21 21 21 / 0.6); }
.sheet-head { display: flex; align-items: center; gap: 14px; padding: 18px 18px 14px 24px; flex: none; }
.sheet-title { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sheet-title h2 { font-size: 1.6rem; }
.sheet-x { width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: var(--sunk); border: 0; border-radius: 8px; color: var(--muted); }
.sheet-x:hover { color: var(--fg); }
.sheet-x svg { width: 17px; height: 17px; }
.sheet-tabs { display: flex; gap: 4px; padding-inline: 24px; border-bottom: 1.5px solid var(--edge); flex: none; overflow-x: auto; }
.sheet-tabs [role="tab"] { background: none; border: 1.5px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 8px 14px; font-weight: 600; font-size: 0.94rem; color: var(--muted); white-space: nowrap; margin-bottom: -1.5px; }
.sheet-tabs [role="tab"]:hover { color: var(--fg); }
.sheet-tabs [role="tab"][aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--edge); border-bottom: 1.5px solid var(--bg); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 18px; align-content: start; padding: 22px 24px 28px; background: var(--bg); }
.sheet-lede { font-size: 1.22rem; line-height: 1.4; font-weight: 500; max-width: 46ch; text-wrap: balance; }
.sheet-body .where-map { max-width: 420px; }
.flow { list-style: none; padding: 16px; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.flow li { display: flex; align-items: center; gap: 10px; font: 600 0.88rem/1.3 var(--f-body); }
.flow li + li::before { content: ""; width: 20px; height: 10px; flex: none; background: var(--fg); clip-path: polygon(0 40%, 62% 40%, 62% 0, 100% 50%, 62% 100%, 62% 60%, 0 60%); }
.flow-step { background: var(--surface); border: 1.5px solid var(--edge); border-radius: 8px; padding: 7px 11px; box-shadow: 0 2px 0 var(--shadow); }
.flow li:last-child .flow-step { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow-edge); box-shadow: 0 2px 0 var(--yellow-edge); }
.example { display: grid; gap: 6px; justify-items: start; border-left: 4px solid var(--yellow); padding: 2px 0 2px 14px; max-width: 65ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.fact { display: grid; gap: 4px; align-content: start; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 0.93rem; min-width: 0; }
.fact-big { font: 700 1.5rem/1.2 var(--f-body); letter-spacing: -0.01em; }
.link { background: none; border: 0; padding: 0; color: var(--link); font-weight: 600; font-size: 0.9rem; text-decoration: underline; text-underline-offset: 2px; }
.warn { display: grid; gap: 4px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 12px 14px; font-size: 0.93rem; }
.warn .eyebrow { color: inherit; }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.sub > summary { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; padding-block: 6px; color: var(--muted); }
.sub > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.7px solid currentColor; border-bottom: 1.7px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; flex: none; }
.sub[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.sub > summary:hover { color: var(--fg); }
.switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; background: var(--line); border: 0; box-shadow: inset 0 0 0 1.5px var(--muted); transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch.small { width: 36px; height: 21px; margin-top: 2px; }
.switch.small::after { width: 15px; height: 15px; }
.switch.small[aria-checked="true"]::after { transform: translateX(15px); }
.switch:disabled { opacity: 0.45; cursor: not-allowed; }
.wfs { display: grid; gap: 10px; }
.wf { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.wf-off { background: transparent; }
.wf-body { min-width: 0; flex: 1; display: grid; gap: 4px; }
.wf-name { font-weight: 700; font-size: 1rem; }
.wf-sentence { font-size: 0.93rem; max-width: 65ch; }
.risk > summary { color: var(--warn-fg); }
.wf-off .wf-name, .wf-off .wf-sentence { color: var(--muted); }
.wf-hint { font-size: 0.85rem; color: var(--muted); }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.need { font: 500 0.72rem/1.5 var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 6px; }
.need.miss { color: var(--warn-fg); background: var(--warn-bg); border-style: solid; border-color: transparent; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.setting { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; font-size: 0.9rem; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.setting label { font-weight: 500; }
.setting input, .setting select { background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
.setting input[aria-invalid="true"] { border-color: var(--warn-fg); outline-color: var(--warn-fg); }
.mark { font: 500 0.72rem/1.5 var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.mark.changed { color: var(--accent); border-color: var(--accent); border-style: solid; }
.aud { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }

.btn-line { background: var(--surface); color: var(--fg); padding: 6px 12px; font-size: 0.88rem; }
.btn-solid { padding: 7px 14px; font-size: 0.9rem; }
.out .btn-solid { border-color: var(--yellow); box-shadow: 0 3px 0 #a8700f; }
.out .btn-solid:hover { box-shadow: 0 4px 0 #a8700f; }
.out .btn-solid:active { box-shadow: 0 1px 0 #a8700f; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; color: var(--code-fg); border: 1.5px solid color-mix(in srgb, var(--code-fg) 45%, transparent); border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 0.9rem; text-decoration: none; }
.btn-ghost:hover { border-color: var(--code-fg); }
.btn-ghost svg { width: 15px; height: 15px; }

.steps { list-style: none; counter-reset: step; padding: 0; display: grid; gap: 26px; max-width: 780px; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px 12px; }
.steps > li::before { content: counter(step); grid-column: 1; grid-row: 1 / span 6; font: 500 1.05rem/1.3 var(--f-mono); color: var(--link); }
.steps > li > * { grid-column: 2; min-width: 0; }
#start-out { display: grid; gap: 12px; margin-top: 6px; }
.agent-steps { padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.94rem; padding-block: 4px 8px; }
.out { background: var(--code-bg); color: var(--code-fg); border: 1.5px solid var(--code-line); border-radius: 12px; overflow: hidden; }
.out-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 12px 16px 0; font-size: 0.8rem; }
.out-title { font: 600 0.72rem/1.4 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; }
.out-picks { opacity: 0.75; font-family: var(--f-mono); }
.out-tabs { display: flex; gap: 2px; padding: 6px 6px 0; }
.out-tab { background: transparent; border: 0; color: var(--code-fg); opacity: 0.6; padding: 8px 12px; border-radius: 8px 8px 0 0; font: 500 0.85rem var(--f-mono); }
.out-tab[aria-selected="true"] { opacity: 1; background: color-mix(in srgb, var(--code-fg) 9%, transparent); }
.out pre { margin: 0; padding: 14px 16px; font: 0.84rem/1.65 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.out-tabs + pre { background: color-mix(in srgb, var(--code-fg) 5%, transparent); }
.out-foot { display: flex; align-items: center; gap: 12px; padding: 4px 16px 16px; font-size: 0.82rem; flex-wrap: wrap; }
.out-note { opacity: 0.85; flex: 1 1 240px; }
.out code { background: color-mix(in srgb, var(--code-fg) 14%, transparent); color: inherit; }
.out a:not(.btn-ghost) { color: inherit; }

.foot { border-top: 1px solid var(--line); padding-block: 28px 56px; font-size: 0.9rem; color: var(--muted); }

@media (max-width: 860px) {
  .hero { padding-block: 28px 22px; }
  .presets, .wheres, .pitch { grid-template-columns: minmax(0, 1fr); }
  .step { padding-block: 32px; }
}
@media (max-width: 560px) {
  .overview img { width: 640px; max-width: none; }
  #pack-sheet { width: 100vw; height: 92dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; border-width: 1.5px 0 0; box-shadow: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-head { padding: 14px 12px 12px 16px; gap: 10px; }
  .sheet-title h2 { font-size: 1.3rem; }
  .icon.big { width: 44px; height: 44px; }
  .sheet-tabs { padding-inline: 16px; }
  .sheet-tabs [role="tab"] { padding-inline: 10px; }
  .sheet-body { padding: 18px 16px 24px; }
  .sheet-lede { font-size: 1.1rem; }
  .flow { flex-direction: column; align-items: flex-start; }
  .flow li { flex-direction: column; align-items: flex-start; }
  .flow li + li::before { transform: rotate(90deg); margin-left: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  html { scroll-behavior: auto; }
}

<script id="fleet-data" type="application/json">{"engineRepo":"Silthus/fleet-engine","defaultPreset":"everyday","filledBySetup":["memory.repo"],"presets":[{"id":"starter","name":"Starter","blurb":"You get safe agent rules, tuned T3 defaults, and draft pull requests.","packs":["pull-requests"],"hubPacks":["hub"],"workflows":{},"hubWorkflows":{}},{"id":"everyday","name":"Everyday","blurb":"You get Starter, maps of tickets, side threads, and agents that write in your voice.","packs":["pull-requests","orchestration","communication"],"hubPacks":["hub"],"workflows":{},"hubWorkflows":{}},{"id":"everything","name":"Everything","blurb":"You get every pack that a Mac can run: Everyday, shared memory, guards, and Slack. With a hub and a node, you also get the Hub, MCP gateway, and Recovery packs, Slack threads, and the nightly loops.","packs":["pull-requests","orchestration","communication","memory","guards","slack"],"hubPacks":["hub","mcp-gateway","recovery"],"hubWorkflows":{"slack-thread":true,"own-account-balancing":true,"provider-recovery":true},"workflows":{"quality-loop":true,"signal-loop":true,"pr-digest":true,"shell-guards":true,"package-age":true}}],"packs":[{"name":"base","title":"Base","summary":"Every machine gets safety rules, the model table, T3 Code defaults, and the jobs that keep it current.","day":"Agents ask before they break things, pick the right model for each task, and every machine is up to date when you start.","cost":"You set up nothing. Every Fleet machine gets it.","risk":"Fleet owns its hooks in Claude Code and Codex. Fleet keeps a hook that you wrote yourself on the same event until you adopt Fleet's.","requires":[],"always":true,"workflows":[{"id":"agent-rules","name":"Agent rules","sentence":"Agents confirm destructive actions, keep private data out of public repos, and pick the right model for each task.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"t3-tuned","name":"T3 Code tuned","sentence":"Each thread gets its own worktree, and threads that hit a usage limit resume by themselves. A worktree without uncommitted changes is removed when its thread settles or after five days.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"nightly-updates","name":"Nightly updates","sentence":"Fleet, your profile, Claude Code, Codex, their plugins, and T3 Code update themselves every night. T3 Code waits until no agent turn runs. A failed update tries again each hour until 05:47 UTC.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"linked-machines","name":"Linked machines","sentence":"Your Mac and your devboxes see each other's threads.","needs":["devbox"],"requires":[],"default":true,"settings":[]},{"id":"worktree-cleanup","name":"Worktree cleanup","sentence":"Every few minutes, Fleet removes idle worktrees whose work has merged.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"disk-guard","name":"Disk guard","sentence":"Agents check free disk before big jobs and run builds and tests in a capped slot, so one job cannot fill or freeze a devbox.","needs":["devbox"],"requires":[],"default":true,"settings":[]}],"settings":[{"key":"base.heavySlots","question":"How many heavy commands may run at once?","type":"number","default":2,"ask":"never"},{"key":"base.diskFloorGigabytes","question":"Below how many free gigabytes should Fleet refuse new worktrees and heavy jobs?","type":"number","default":10,"ask":"never"},{"key":"base.startFloorGigabytes","question":"Below how many free gigabytes should fleet disk --start refuse a new thread or scheduled run?","type":"number","default":25,"ask":"never"}]},{"name":"pull-requests","title":"Pull-requests","summary":"Every fix or feature ends as a proven, reviewed draft pull request, and ship words take it to merged.","day":"You ask for a fix, and later find a draft pull request with its tests, its proof, and a review from a second model.","cost":"It needs GitHub, and setup signs you in. Each pull request spends extra usage on reviews. Expect at least one round, often two, and short final reads.","risk":"Ship words merge without asking again. Say them only for work you would merge yourself.","requires":[],"always":false,"workflows":[{"id":"draft-prs","name":"Draft PR flow","sentence":"Every fix or feature ends as a proven, reviewed draft pull request that you mark ready yourself.","needs":["gh"],"requires":[],"default":true,"settings":["pull-requests.freeReviews","pull-requests.reviewCeiling","pull-requests.reviewTimeoutMinutes","pull-requests.panelSlots"]},{"id":"pr-care","name":"PR care","sentence":"When you ask, an agent watches a pull request, fixes CI, and answers review comments, and it can refresh a stale one.","needs":["gh"],"requires":[],"default":true,"settings":["pull-requests.commentApproval"]},{"id":"ship-words","name":"Ship words","sentence":"Say \"full send\" or \"stamp it\", and the agent takes a pull request to merged and rolled out.","needs":["gh"],"requires":[],"default":true,"settings":["pull-requests.mergeCommand","pull-requests.approvalBot"],"risk":"The agent merges without asking again once you say the words."}],"settings":[{"key":"pull-requests.commentApproval","question":"Which comments should agents show you before they post them?","type":"choice","default":"people","ask":"never","choices":[{"value":"people","label":"Comments a person reads"},{"value":"all","label":"Every comment"},{"value":"none","label":"None"}]},{"key":"pull-requests.mergeCommand","question":"Which command merges a pull request when the repo names no merge method? Leave it empty to merge as the rollout skill says.","type":"string","ask":"never","optional":true},{"key":"pull-requests.freeReviews","question":"How many review rounds may run before the review arbiter decides whether another round is worth it?","type":"number","default":2,"ask":"never"},{"key":"pull-requests.reviewCeiling","question":"After how many review rounds does review stop for good?","type":"number","default":6,"ask":"never"},{"key":"pull-requests.reviewTimeoutMinutes","question":"How many minutes may one review run before it counts as failed?","type":"number","default":20,"ask":"never"},{"key":"pull-requests.panelSlots","question":"How many reviewers may run at once in a review panel?","type":"number","default":3,"ask":"never"},{"key":"pull-requests.reviewFallback","question":"What should fleet pr review tell an agent to do when no pack provides a review bot? {repo} and {pr} stand for the pull request.","type":"string","optional":true,"ask":"never"},{"key":"pull-requests.stampFallback","question":"What should fleet pr stamp tell an agent to do when no pack provides a review bot? {repo} and {pr} stand for the pull request.","type":"string","optional":true,"ask":"never"},{"key":"pull-requests.approvalBot","question":"Which bot or reviewer should approve a pull request when you say \"stamp it\"?","type":"string","optional":true,"ask":"never"}]},{"name":"orchestration","title":"Orchestration","summary":"Big work becomes a map of tickets that a conductor thread works through, and side work gets its own thread.","day":"You describe a large change once. A conductor thread splits it into tickets and starts one worker thread per ticket. Once you turn them on, the loops improve your repo overnight.","cost":"The loops run on an always-on devbox and spend your AI plan's usage each night, so they start off.","risk":"The loops open pull requests without you in the room. Each one stays a draft until you say otherwise.","requires":["pull-requests"],"always":false,"workflows":[{"id":"maps","name":"Planning maps","sentence":"Big work becomes a map of tickets, and a conductor thread works through it with one worker thread per ticket.","needs":[],"requires":[],"default":true,"settings":["orchestration.tracker","orchestration.lessonsLog","orchestration.rolloutLog","orchestration.goals","orchestration.analyticsProject"]},{"id":"side-threads","name":"Side threads","sentence":"When you agree to a side fix, it starts in its own T3 thread, and this thread stays on its task.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"quality-loop","name":"Quality loop","sentence":"Each night, agents improve one area of a repo through small, proven draft pull requests that you review.","needs":["always-on devbox"],"requires":[],"default":false,"settings":["orchestration.loopProject","orchestration.qualityArea","orchestration.criticalPaths","orchestration.ledgerRepo"],"risk":"Spends your AI plan's usage every night."},{"id":"signal-loop","name":"Signal loop","sentence":"Each night, agents turn production errors and friction that nobody handles into small draft fix pull requests.","needs":["always-on devbox"],"requires":[],"default":false,"settings":["orchestration.loopProject","orchestration.qualityArea","orchestration.criticalPaths","orchestration.ledgerRepo","orchestration.signalSource"],"risk":"Reads production signals and spends your AI plan's usage every night."},{"id":"pr-digest","name":"PR digest","sentence":"Each weekday morning, one thread lists your open pull requests and what blocks each one.","needs":["always-on devbox"],"requires":[],"default":false,"settings":["orchestration.loopProject"]}],"settings":[{"key":"orchestration.tracker","question":"Which repo's issues hold your maps? Leave it empty to use your Fleet profile repo.","type":"string","optional":true,"ask":"never"},{"key":"orchestration.lessonsLog","question":"Which file holds the lessons log that maps read and write, such as a path in a private repo?","type":"string","optional":true,"ask":"never"},{"key":"orchestration.rolloutLog","question":"Which file logs your rollouts, one JSON line per stage, so fleet lessons can name holds and rollbacks? ~/ is allowed.","type":"string","default":"","ask":"never"},{"key":"orchestration.goals","question":"Where do your team's goals live, so a map can name the metric its work moves?","type":"string","optional":true,"ask":"never"},{"key":"orchestration.analyticsProject","question":"Which analytics project shows how people use your product?","type":"string","optional":true,"ask":"never"},{"key":"orchestration.loopProject","question":"Which T3 project do the loops and the PR digest run in?","type":"string"},{"key":"orchestration.qualityArea","question":"Which paths of the repo may the loops change, such as src/billing?","type":"string"},{"key":"orchestration.criticalPaths","question":"Which paths need your review before a loop's pull request is ready, such as src/payments?","type":"string","optional":true},{"key":"orchestration.ledgerRepo","question":"Which private repo holds the loops' ledger? It records production numbers, so keep it private.","type":"string"},{"key":"orchestration.signalSource","question":"Where should the signal loop read production errors and friction? Leave it empty to use an analytics MCP when one is connected.","type":"string","optional":true,"ask":"never"}]},{"name":"communication","title":"Communication","summary":"Agents write in your voice, give short updates, and share plans and previews as links.","day":"Agents draft messages, pull request descriptions, and docs the way you write them. Plans and running apps reach other people as links.","cost":"It spends no extra usage beyond the drafts you ask for.","risk":"Shared plans are secret gists. Anyone with the link can read them.","requires":[],"always":false,"workflows":[{"id":"voice","name":"Your voice","sentence":"Agents write messages, pull request descriptions, and docs in your voice, from a skill you own.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"updates","name":"Updates and shared plans","sentence":"Agents give updates with the outcome first, and share plans and reports as one link. Type /explain-diff to have a change explained.","needs":[],"requires":[],"default":true,"settings":[]}],"settings":[]},{"name":"memory","title":"Memory","summary":"Agents on all your machines share what they learn through your own private memory repo.","day":"A trap one agent hits on your laptop is a note the next agent reads on your devbox, minutes later.","cost":"You need a small private GitHub repo. It syncs every five minutes.","risk":"Agents write notes about you and your work into the memory repo. Keep it private.","requires":[],"always":false,"workflows":[{"id":"shared-memory","name":"Shared memory","sentence":"Agents on every machine read and write one private memory repo, which syncs every five minutes.","needs":["gh"],"requires":[],"default":true,"settings":["memory.repo","memory.subtree"]}],"settings":[{"key":"memory.repo","question":"Which private GitHub repo holds your agent memory, such as you/agent-notes?","type":"string","ask":"setup"},{"key":"memory.subtree","question":"Which folder of the memory repo holds the memory? Leave it empty when the memory is the whole repo.","type":"string","default":"","ask":"never"}]},{"name":"guards","title":"Guards","summary":"Hooks stop an agent's shell commands from running network code, using GitHub outside your owners, pushing past review, or polling in loops.","day":"A prompt injection that tells an agent to pipe a script into a shell gets a refusal that names you, and the agent stops to ask.","cost":"You run nothing. A hook checks each shell command before it starts.","risk":"A guard can refuse a command you meant. The refusal says why and what to do instead. Every guard is off until you turn it on.","requires":[],"always":false,"workflows":[{"id":"shell-guards","name":"Shell guards","sentence":"Agents cannot pipe network code into a shell, run a package the project lacks, change how Git maps URLs, use gh outside your GitHub owners, poll in a loop of turns, kill their own shell with pkill -f, skip Git hooks, force-push without a lease, or push to main of a repository that takes pull requests.","needs":[],"requires":[],"default":false,"settings":["guards.owners","guards.main-push-repos"]},{"id":"git-allowlist","name":"Signed Git allowlist","sentence":"Git refuses any remote whose GitHub owner is not on a list you signed. With the shell guards on, gh follows the same list.","needs":["devbox"],"requires":[],"default":false,"settings":["guards.owners","guards.signers"],"risk":"Git refuses every remote outside the signed list, including other hosts than GitHub. Root, or anyone with sudo, can remove it. It stops mistakes, not a hostile agent. An agent that runs as you can override it with its own Git config, or edit the staged script before you run it with sudo."},{"id":"package-age","name":"Package age","sentence":"Package installs through pnpm and Bun take only versions at least three days old, unless a project or you set another age.","needs":[],"requires":[],"default":false,"settings":[]},{"id":"oom-survival","name":"OOM survival","sentence":"Before memory runs out, earlyoom stops a runaway test or build, and T3's agent threads survive when the kernel kills a process inside them.","needs":["devbox"],"requires":[],"default":false,"settings":[]}],"settings":[{"key":"guards.person","question":"Whom should a refusal tell the agent to ask, such as your first name?","type":"string","default":"the person who runs this machine","ask":"never"},{"key":"guards.owners","question":"Which GitHub owners may agents use, separated by commas, such as you,your-org?","type":"string","optional":true,"ask":"never"},{"key":"guards.main-push-repos","question":"Which GitHub repositories take pushes straight to main or master, as owner/name separated by commas?","type":"string","optional":true,"ask":"never"},{"key":"guards.signers","question":"Which SSH public keys may sign the Git allowlist, one per line?","type":"string","optional":true,"ask":"never"}]},{"name":"slack","title":"Slack","summary":"Your own message, reaction, or mention in Slack starts a T3 thread about it.","day":"A teammate reports a bug in a Slack thread. You react with :t3code:, and a thread starts to find the cause, with the whole Slack thread as its context.","cost":"You need your own Slack app, which you make from a manifest in a few minutes. One small process stays connected to Slack.","risk":"Your Slack messages and the threads they belong to become agent prompts. Only your own messages, reactions, and mentions start a thread, and the prompt treats the rest of the Slack thread as data.","requires":[],"always":false,"workflows":[{"id":"slack-thread","name":"Start a thread from Slack","sentence":"Your own Slack message with :t3code:, your :t3code: reaction, or a mention of your Slack app starts a T3 thread, and Slack shows you its link.","needs":[],"requires":[],"default":false,"settings":["slack.userId"],"risk":"Your Slack messages and the threads they belong to become agent prompts. Only your own messages, reactions, and mentions start a thread."}],"settings":[{"key":"slack.userId","type":"string","question":"What is your Slack member ID, so only your own messages start threads? In Slack, open your profile, then More, then Copy member ID."}]},{"name":"hub","title":"Hub","summary":"One always-on devbox manages the others. It keeps your devboxes linked and watches their disks.","day":"A thread on one devbox starts work on another, and the hub cleans a devbox that fills its disk before you notice.","cost":"You need one devbox that stays on, and some setup on it. Every other machine keeps working when the hub is down.","risk":"The hub holds sign-ins for your MCP servers and reaches every devbox over SSH. Keep it as private as your laptop.","requires":[],"always":false,"workflows":[{"id":"disk-watch","name":"Disk watch","sentence":"The hub cleans a devbox whose disk runs low with fleet prune and each tool's own cache cleaner, and names the largest folders only when that cannot free enough.","needs":["hub"],"requires":[],"default":true,"settings":["hub.alias","hub.diskSweepGigabytes","hub.diskAlertGigabytes","hub.threadFolder"],"risk":"The sweep deletes only this. Through fleet prune: worktrees idle for 6 hours, or 24 when no T3 thread or agent owns them, whose commits are on the default branch or in a merged pull request, whose T3 thread is closed, or whose agent has been idle for a day. Their commits stay on their branch, but their lockfile and tool output changes are dropped. Also worktree folders that Git no longer tracks and no open T3 thread uses. Itself: the oldest part of a T3 boot log over 100 MB. Through pnpm store prune, uv cache prune and go clean -cache: caches those tools fill again. It never runs Nix garbage collection and never removes Cargo build output, the uv cache folder, old T3 versions, Docker data or Bun's cache, which projects can link into. It deletes no other file. For the rest, you decide."},{"id":"linked-hub","name":"Hub links","sentence":"The hub keeps SSH tunnels and T3 links to every devbox open, so each one can start threads on the others.","needs":["hub"],"requires":[],"default":true,"settings":["hub.alias","hub.httpsHost","hub.relayPort"]},{"id":"dream","name":"Dream","sentence":"Each night, the hub reads the day's agent sessions from every machine and opens one draft pull request that adds to, condenses, and prunes your shared memory.","needs":["hub","gh"],"requires":[],"default":false,"settings":["hub.alias","hub.dreamSessions"],"risk":"Every run sends your agent sessions to an analyst model and spends your AI plan's usage, so it starts off. Your session text stays on the hub for 14 days."},{"id":"own-account-balancing","name":"Own-account balancing","sentence":"The hub holds your own Claude or Codex subscriptions in a local proxy, and Claude Code and Codex on the hub, your devboxes, and boxes go through it, spending the Claude subscription whose weekly quota resets first.","needs":["hub"],"requires":[],"default":false,"settings":["hub.alias","hub.relayPort","hub.proxyAccounts"],"risk":"On the Claude and both plans, the hub keeps your Claude sign-ins in CLIProxyAPI, and every machine in the workflow sends Claude Code through it. On the Codex and both plans, it keeps your ChatGPT sign-ins there, and every machine sends Codex through it. The balancer ranks only Claude subscriptions by reset date. Read Anthropic's terms first, and OpenAI's terms for your plan too. As read on 2026-11-05: the Anthropic Usage Policy, effective Nov 12, 2026, section \"Do Not Abuse Our Platform\" (https://www.anthropic.com/legal/aup), lists: \"Resell, proxy, or otherwise provide access to Claude through unauthorized means, including services that route requests through consumer subscriptions or misrepresent the product or client being used\". The Anthropic Consumer Terms, effective Oct 8, 2025, section 2 (https://www.anthropic.com/legal/consumer-terms), say: \"You may not share your Account login information, Anthropic API key, or Account credentials with anyone else. You also may not make your Account available to anyone else.\" Section 3, item 7 of the same terms lists: \"Except when you are accessing our Services via an Anthropic API Key or where we otherwise explicitly permit it, to access the Services through automated or non-human means, whether through a bot, script, or otherwise.\" Balancing is only for your own subscriptions, never for someone else's."}],"settings":[{"key":"hub.alias","question":"What is the SSH name of your hub, the always-on devbox that manages the others, such as my-hub?","type":"string"},{"key":"hub.diskSweepGigabytes","question":"Below how many free gigabytes does the hub clean a devbox's disk?","type":"number","default":15,"ask":"never"},{"key":"hub.diskAlertGigabytes","question":"Below how many free gigabytes after a cleanup does the hub tell you?","type":"number","default":10,"ask":"never"},{"key":"hub.httpsHost","question":"Which private host name does a browser on your own computer use to open the hub's sign-in pages over HTTPS, such as hub.internal.example.com? Devboxes always reach the hub through their SSH tunnels. Leave it empty to skip HTTPS.","type":"string","optional":true,"ask":"never"},{"key":"hub.relayPort","question":"Which port on the hub do the SSH tunnels from your devboxes use?","type":"number","default":60001,"ask":"never"},{"key":"hub.dreamSessions","question":"How many sessions may one Dream run send to an analyst model? Each one spends model tokens.","type":"number","default":150,"ask":"never"},{"key":"hub.threadFolder","question":"Which folder do the hub's threads start in, such as ~/notes? The hub starts its disk alerts there. Fleet adds it as a T3 Code project when T3 does not know it yet.","type":"string","default":"~","ask":"never"},{"key":"hub.proxyAccounts","question":"How many of your own subscriptions must the hub's proxy hold before fleet cli-proxy doctor passes? They are Claude subscriptions, or Codex ones on the Codex plan.","type":"number","default":2,"ask":"never"}]},{"name":"mcp-gateway","title":"MCP gateway","summary":"The hub signs in to your MCP servers once, and agents on every machine reach them through it.","day":"Every machine reaches your MCP servers through the hub, signed in once.","cost":"The hub needs Docker. Every other machine reaches the gateway through its tunnel to the hub.","risk":"The hub holds the sign-ins for your MCP servers, and each machine holds a key that reaches all of them. Keep the hub as private as your laptop.","requires":[],"always":false,"workflows":[{"id":"mcp-gateway","name":"MCP gateway","sentence":"The hub signs in to your MCP servers once, and agents on every machine reach them through it.","needs":[],"requires":[],"default":true,"settings":[]},{"id":"slack-bridge","name":"Slack bridge","sentence":"Agents read Slack as you through the MCP gateway, and leave only unsent drafts and canvases.","needs":[],"requires":[],"default":false,"settings":[],"risk":"The bridge acts as your Slack account. It reads what you can read, and writes only drafts you send yourself and canvases."},{"id":"gmail","name":"Gmail","sentence":"Agents read your mail and leave replies as unsent drafts, through the MCP gateway.","needs     if (no.includes(text.toLowerCase()))

    throw new FlagError(`${setting.key} takes on or off`);

  if (setting.type === "choice") {

      throw new FlagError(`${setting.key} takes one of ${(setting.choices ?? []).map((item) => String(item.value)).join(", ")}`);

  }
  if (text === "")

  return text;
}

    ${pack.day ? `<div class="example"><p class="eyebrow">For example</p><p>${fmt(pack.day)}</p></div>` : ""}
    ${locked ? `<div class="example"><p>This pack runs on a hub. Add a hub and a node to turn it on.</p>${hubButton("sheet:unlock", `sheet:pack:${pack.name}`)}</div>` : ""}
    <div class="facts">
      <div class="fact"><p class="eyebrow">Workflows</p><p class="fact-big">${packOn(pack) ? `${live} of ${pack.workflows.length} on` : pack.workflows.length}</p><button class="link" data-act="sheet-tab" data-id="workflows" data-focus="sheet:see">See the workflows</button></div>
      <div class="fact"><p class="eyebrow">Needs</p><p>${asks ? esc(asks[0].toUpperCase() + asks.slice(1)) : "Nothing extra"}</p></div>
      ${pack.cost ? `<div class="fact"><p class="eyebrow">Cost</p><p>${fmt(pack.cost)}</p></div>` : ""}
    </div>
    ${pack.risk ? `<div class="warn"><p class="eyebrow">Know before you turn it on</p><p>${fmt(pack.risk)}</p></div>` : ""}`;
}
function sheetSettings(pack) {
  if (!packOn(pack))
    return '<p class="muted">Turn the pack on to change its settings.</p>';
  return settingsBlock(pack) || '<p class="muted">The workflows that are on have no settings.</p>';
}
function packSheet(pack) {
  const on = packOn(pack);
  const locked = needsHub(pack) && picks.where === "mac";
  const control = pack.always || locked ? "" : `<button class="switch" role="switch" aria-label="${esc(pack.title)} pack" aria-checked="${on}" data-act="pack" data-id="${esc(pack.name)}" data-focus="sheet:pack:${esc(pack.name)}"></button>`;
  const tabs = [["overview", "Overview"], ["workflows", `Workflows (${pack.workflows.length})`], ...pack.settings.length ? [["settings", `Settings (${on ? activeSettings(data, picks, pack).length : pack.settings.length})`]] : []];
  const tab = tabs.some(([id]) => id === sheetTab) ? sheetTab : "overview";
  const hint = on || locked ? "" : '<p class="muted">Turn the pack on to choose its workflows.</p>';
  const panel = tab === "overview" ? sheetOverview(pack, locked) : tab === "workflows" ? `${hint}<div class="wfs">${workflowRows(pack)}</div>` : sheetSettings(pack);
  return `<header class="sheet-head">
      ${iconTile(pack.name, "big")}
      <div class="sheet-title"><h2 id="sheet-title">${esc(pack.title)}</h2><p class="status">${packStatus(pack)}</p></div>
      ${control}
      <button class="sheet-x" data-act="close" data-focus="sheet:close" aria-label="Close">${uiIcons.close}</button>
    </header>
    <div class="sheet-tabs" role="tablist" aria-label="${esc(pack.title)} pack sections">${tabs.map(([id, label]) => `<button role="tab" id="tab-${id}" aria-selected="${id === tab}" aria-controls="sheet-panel" tabindex="${id === tab ? 0 : -1}" data-act="sheet-tab" data-id="${id}" data-focus="sheet:tab:${id}">${label}</button>`).join("")}</div>
    <div class="sheet-body" id="sheet-panel" role="tabpanel" aria-labelledby="tab-${tab}">${panel}</div>`;
}
function showSheet(keepScroll) {
  const scrolled = keepScroll ? sheet.querySelector(".sheet-body")?.scrollTop ?? 0 : 0;
  sheet.innerHTML = packSheet(packOf2(openPack));
  sheet.querySelector(".sheet-body").scrollTop = scrolled;
}
function packsSection() {
  const anywhere = data.packs.filter((pack) => !needsHub(pack));
  const onHub = data.packs.filter(needsHub);
  const hubHead = picks.where === "mac" ? `<p class="muted">These packs run on a hub.</p>${hubButton("unlock", `pack:${onHub[0]?.name ?? ""}`)}` : '<p class="muted">These packs run on your hub. The agent turns them on after it sets up the hub.</p>';
  return `<section id="packs" class="step" aria-labelledby="packs-h">
    ${stepHead(2, "packs", "Which packs do you want?", "A pack is a set of workflows that you turn on as a whole. Start from a preset, then turn packs on or off. Select a pack to read what it does.")}
    ${presetCards()}
    <div class="group-head"><h3>On any machine</h3></div>
    <div class="packs">${anywhere.map(packCard).join("")}</div>
    ${onHub.length ? `<div class="group-head"><h3>With a hub</h3>${hubHead}</div><div class="packs">${onHub.map(packCard).join("")}</div>` : ""}
    <p class="aud">${iconTile(data.teamPacks[0] ?? "", "mini")}<span>${esc(data.teamNote)}</span></p>
  </section>`;
}
function promptPicks() {
  const { first, later } = setupSplit(data, picks);
  const parts = [whereLabels[picks.where], `Base and ${plural(first.length, "pack")} on the first setup`, ...picks.where === "hub" ? [`${plural(later.length, "pack")} once the hub runs`] : []];
  return parts.join(", ");
}
function agentSteps() {
  const asks = questions(data, picks);
  const steps = [
    "It asks what you already know, and explains only the rest.",
    "It installs what is missing on your Mac: the Command Line Tools, Homebrew, the GitHub CLI, Bun, the `t3` command, and Fleet.",
    "You sign in to GitHub, and to Claude, ChatGPT, or both. Each sign-in opens in your browser.",
    `It asks which AI plan you use${asks.settings.length ? `, and ${plural(asks.settings.length, "more question")} that your packs need` : ""}.`,
    "It saves your picks to `fleet-profile`, a private repo in your GitHub account, so every machine you add gets the same setup.",
    ...picks.where === "hub" ? ["It creates the hub and the node with you, installs Fleet on both, and links them to your Mac."] : [],
    "It ends with `fleet doctor`, which checks each machine against your profile."
  ];
  return `<ol class="agent-steps">${steps.map((step) => `<li>${fmt(step)}</li>`).join("")}</ol>`;
}
function byHand() {
  const text = tab === "command" ? commandText(data, picks) : JSON.stringify(profileFile(data, picks), null, 2);
  const later = picks.where === "hub" ? ` It sets up this Mac only. The hub, the node, and the packs that wait for the hub come after it. Step 9 of <a href="https://github.com/${esc(data.engineRepo)}/blob/main/SETUP.md#9-add-the-hub-and-the-node" target="_blank" rel="noopener">the setup guide</a> has the commands.` : "";
  const note = tab === "command" ? `Run it in a terminal on your Mac. Setup keeps these picks with one key press, signs you in, and ${esc(setupAsks(data, picks))}.${later}` : "Setup saves these picks to <code>fleet.json</code> in your private <code>fleet-profile</code> repo. Every machine you set up reads it.";
  return `<div class="out">
    <div class="out-tabs" role="tablist">
      <button class="out-tab" role="tab" data-act="tab" data-id="command" data-focus="tab:command" aria-selected="${tab === "command"}">One command</button>
      <button class="out-tab" role="tab" data-act="tab" data-id="profile" data-focus="tab:profile" aria-selected="${tab === "profile"}">fleet.json</button>
    </div>
    <pre id="hand-text">${esc(text)}</pre>
    <div class="out-foot"><span class="out-note">${note}</span><button class="btn-solid" data-act="copy" data-id="hand-text" data-focus="copy:hand">Copy</button></div>
  </div>`;
}
function startOut() {
  const prompt = promptText(data, picks);
  return `<div class="out prompt">
      <div class="out-head"><span class="out-title">Your prompt</span><span class="out-picks">${esc(promptPicks())}</span></div>
      <pre id="prompt-text">${esc(prompt)}</pre>
      <div class="out-foot"><button class="btn-solid" data-act="copy" data-id="prompt-text" data-focus="copy:prompt">Copy prompt</button><a class="btn-ghost" data-focus="open:t3" href="https://app.t3.codes/new?prompt=${encodeURIComponent(prompt)}" target="_blank" rel="noopener">Open in T3 Code${uiIcons.arrow}</a></div>
    </div>
    <p class="prose">The agent explains each part and runs the steps itself. You answer its questions and do your own sign-ins.</p>
    <details class="sub" ${open("start:agent")}><summary>What the agent does with you</summary>${agentSteps()}</details>
    <details class="sub" ${open("start:hand")}><summary>Set it up by hand</summary>${byHand()}</details>`;
}
function startSection() {
  return `<section id="start" class="step" aria-labelledby="start-h">
    ${stepHead(3, "start", "Get started", "There are three steps. In the last one, an agent takes over and sets up Fleet with you.")}
    <ol class="steps">
      <li><h3>Download T3 Code</h3><p>Get <a href="https://t3.codes" target="_blank" rel="noopener">T3 Code</a> and open it. Its Welcome page sets up one agent, Claude Code or Codex, and signs you in.</p></li>
      <li><h3>Sign in with T3 Connect</h3><p>In T3 Code, open <b>Settings → Sharing &amp; access</b>, sign in, and turn on <b>T3 Connect</b>. It links your Mac to your devboxes and your phone.</p></li>
      <li><h3>Paste this prompt</h3><p>Paste it into a new thread in T3 Code on your Mac. It carries your picks from this page, so the agent skips those questions.</p><div id="start-out">${startOut()}</div></li>
    </ol>
  </section>`;
}
function footer() {
  return `<footer class="foot"><div class="wrap"><p>Fleet is open source. Read the code and the docs at <a href="https://github.com/${esc(data.engineRepo)}" target="_blank" rel="noopener">github.com/${esc(data.engineRepo)}</a>.</p></div></footer>`;
}
var focusOf = () => {
  const active = document.activeElement;
  return active instanceof HTMLElement ? [active.dataset.focus, active.dataset.fallback] : [];
};
function restoreFocus(keys) {
  for (const key of keys) {
    const target = key ? document.querySelector(`[data-focus="${CSS.escape(key)}"]`) : null;
    if (!target || target.disabled)
      continue;
    target.focus({ preventScroll: true });
    return;
  }
}
var rememberOpened = () => opened = new Set([...document.querySelectorAll("details[data-open][open]")].map((details) => details.dataset.open));
function render() {
  const focus = focusOf();
  const top = window.scrollY;
  rememberOpened();
  document.getElementById("app").innerHTML = `${hero()}<main class="wrap">${whereSection()}${packsSection()}${startSection()}</main>${footer()}`;
  window.scrollTo(0, top);
  if (openPack)
    showSheet(true);
  restoreFocus(focus);
}
function refreshOutputs() {
  const focus = focusOf();
  rememberOpened();
  const out = document.getElementById("start-out");
  if (out)
    out.innerHTML = startOut();
  restoreFocus(focus);
}
function copy(button, id) {
  const text = document.getElementById(id);
  const select = () => {
    const range = document.createRange();
    range.selectNodeContents(text);
    const selection = window.getSelection();
    selection?.removeAllRanges();
    selection?.addRange(range);
    button.textContent = "Selected: press Ctrl-C or ⌘C";
  };
  if (!navigator.clipboard)
    return select();
  navigator.clipboard.writeText(text.textContent ?? "").then(() => button.textContent = "Copied", select);
}
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-act]");
  if (!target || target.disabled)
    return;
  const { act, id = "" } = target.dataset;
  if (act === "copy")
    return copy(target, id);
  if (act === "close")
    return sheet.close();
  if (act === "open") {
    openPack = id;
    sheetTab = "overview";
    showSheet(false);
    if (!sheet.open)
      sheet.showModal();
    return;
  }
  if (act === "sheet-tab")
    return showTab(id);
  if (act === "tab") {
    tab = id === "profile" ? "profile" : "command";
    return refreshOutputs();
  }
  if (act === "where") {
    const where = id === "hub" ? "hub" : "mac";
    if (picks.where === where)
      return;
    picks = setWhere(data, picks, where);
  }
  if (act === "preset")
    picks = presetPicks(data, id, picks.settings, picks.where);
  if (act === "pack")
    picks = togglePack(data, picks, id);
  if (act === "wf")
    picks = toggleWorkflow(data, picks, id);
  render();
});
function showTab(tab) {
  rememberOpened();
  sheetTab = tab;
  showSheet(false);
  restoreFocus([`sheet:tab:${tab}`]);
}
sheet.addEventListener("keydown", (event) => {
  const tab = event.target.closest('[role="tab"]');
  if (!tab || event.key !== "ArrowRight" && event.key !== "ArrowLeft")
    return;
  event.preventDefault();
  const tabs = [...sheet.querySelectorAll('[role="tab"]')];
  const next = tabs[(tabs.indexOf(tab) + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  showTab(next.dataset.id);
});
sheet.addEventListener("click", (event) => {
  if (event.target === sheet)
    sheet.close();
});
sheet.addEventListener("close", () => {
  if (sheet.open)
    return;
  const closed = openPack;
  openPack = undefined;
  sheet.innerHTML = "";
  restoreFocus([`open:${closed}`]);
});
function onSetting(event, committed) {
  const input = event.target;
  const key = input.dataset?.key;
  const setting = key && data.packs.flatMap((pack) => pack.settings).find((item) => item.key === key);
  if (!setting)
    return;
  const text = input.value.trim();
  let value;
  try {
    value = text === "" ? undefined : parseSettingValue(setting, text);
  } catch (error) {
    input.setAttribute("aria-invalid", "true");
    input.title = error.message;
    return;
  }
  input.removeAttribute("aria-invalid");
  input.removeAttribute("title");
  picks = setSetting(data, picks, setting.key, value);
  if (committed && input instanceof HTMLInputElement)
    input.value = value === undefined ? "" : String(value);
  refreshMarks();
  refreshOutputs();
}
document.addEventListener("input", (event) => onSetting(event, false));
document.addEventListener("change", (event) => onSetting(event, true));
render();
</script>
